<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>報價單產生器</title>
<style>
:root{
  --bg:#f3f5f8;--card:#fff;--ink:#1f2937;--sub:#6b7280;--line:#e5e7eb;
  --brand:#1d4ed8;--brand-d:#1e40af;--danger:#dc2626;--ok:#059669;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:16px 14px 110px}
h1{font-size:20px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:15px;margin:0 0 12px;color:var(--sub);font-weight:600}
label{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:var(--ink)}
input[readonly]{background:#f8fafc;color:#334155}
input:focus,select:focus,textarea:focus{outline:2px solid #93c5fd;border-color:var(--brand)}
input:disabled,select:disabled,textarea:disabled{background:#f1f5f9;color:#94a3b8}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.grid.two{grid-template-columns:1fr 1fr}
@media(min-width:760px){.grid.cust{grid-template-columns:2fr 1fr 1fr}.grid.pick{grid-template-columns:repeat(6,1fr)}.grid.pick .w2{grid-column:span 2}}
.qty{display:flex;gap:6px}
.qty button{flex:0 0 44px;border:1px solid #cbd5e1;background:#fff;border-radius:10px;font-size:20px;cursor:pointer}
.qty input{text-align:center}
.err{display:none;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.err.show{display:block}
.status{font-size:13px;color:var(--sub);margin:-6px 0 12px}
.status.ok{color:var(--ok)}

/* items: mobile cards */
.head{display:none}
.item{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fafbfc}
.item>div::before{content:attr(data-l);display:block;font-size:12px;color:var(--sub)}
.item .c-no{font-weight:700}
.item .c-name{grid-column:1/-1;font-weight:600}
.item .c-name::before,.item .c-no::before{display:none}
.item .c-qty input{padding:8px 10px}
.item .c-amt{font-weight:700}
.item .c-del{grid-column:1/-1}
.del{width:100%;border:1px solid #fecaca;background:#fff;color:var(--danger);border-radius:10px;padding:8px;font:inherit;cursor:pointer}
.empty{text-align:center;color:var(--sub);padding:18px 0}
@media(min-width:760px){
  .head,.item{grid-template-columns:110px 1fr 70px 100px 100px 110px 64px;align-items:center;gap:10px}
  .head{display:grid;font-size:12px;color:var(--sub);padding:0 12px 6px}
  .item{padding:8px 12px;margin-bottom:6px}
  .item>div::before{display:none}
  .item .c-name{grid-column:auto}
  .item .c-del{grid-column:auto}
  .item .c-price,.item .c-amt,.head .r{text-align:right}
  .del{padding:6px}
}
.sum{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.sum div{display:flex;justify-content:space-between;padding:3px 0}
.sum .total{font-size:18px;font-weight:700;color:var(--brand)}

/* fixed action bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:960px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:14px 10px;font:inherit;font-weight:700;cursor:pointer;background:#e2e8f0;color:#0f172a}
.btn.pri{background:var(--brand);color:#fff}
.btn.pri:active{background:var(--brand-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* quote view */
#quoteView{position:fixed;inset:0;background:#e5e7eb;overflow:auto;display:none;z-index:40;padding:14px 0 110px}
#quoteView.show{display:block}
#sheetBox{margin:0 auto;overflow:hidden}
#sheet{width:794px;background:#fff;padding:40px 44px;transform-origin:top left;font-size:14px;color:#111}
.sheet h1{text-align:center;font-size:28px;letter-spacing:.4em;margin:0 0 4px}
.sheet .co{text-align:center;color:#444;margin-bottom:18px;font-size:13px}
.sheet .meta{display:flex;justify-content:space-between;gap:20px;border-top:2px solid #111;border-bottom:1px solid #999;padding:10px 0;margin-bottom:14px}
.sheet .meta div{line-height:1.8}
.sheet table{width:100%;border-collapse:collapse}
.sheet th,.sheet td{border:1px solid #888;padding:7px 8px;text-align:left;vertical-align:top}
.sheet th{background:#eee}
.sheet td.r,.sheet th.r{text-align:right}
.sheet td.c,.sheet th.c{text-align:center}
.sheet tr{page-break-inside:avoid}
.sheet .tot{margin:14px 0 0 auto;width:300px;page-break-inside:avoid}
.sheet .tot div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #ccc}
.sheet .tot .g{font-weight:700;font-size:17px;border-bottom:2px solid #111}
.sheet .note{margin-top:18px;font-size:12.5px;color:#333;white-space:pre-wrap;page-break-inside:avoid}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="wrap" id="app">
  <h1>報價單產生器</h1>

  <div class="err" id="err"></div>

  <div class="card">
    <h2>報價資訊</h2>
    <div class="grid cust">
      <div><label for="cust">客戶名稱 *</label><input id="cust" placeholder="例：○○股份有限公司" autocomplete="off"></div>
      <div><label for="contact">聯絡人（選填）</label><input id="contact" autocomplete="off"></div>
      <div><label for="qdate">報價日期</label><input id="qdate" type="date"></div>
    </div>
  </div>

  <div class="card">
    <h2>選擇品項</h2>
    <div class="status" id="status">資料載入中…</div>
    <div class="grid pick">
      <div class="w2"><label for="selType">類別</label><select id="selType" disabled><option value="">請選擇類別</option></select></div>
      <div class="w2"><label for="selPno">編號</label><select id="selPno" disabled><option value="">請先選類別</option></select></div>
      <div class="w2"><label for="fName">品名</label><input id="fName" readonly></div>
      <div><label for="fUnit">單位</label><input id="fUnit" readonly></div>
      <div><label for="fPrice">單價</label><input id="fPrice" readonly></div>
      <div class="w2"><label for="qty">數量（填 0 = 刪除）</label>
        <div class="qty">
          <button type="button" id="qMinus" aria-label="減少">−</button>
          <input id="qty" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
          <button type="button" id="qPlus" aria-label="增加">＋</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>已選品項（<span id="cnt">0</span>）</h2>
    <div class="head"><div>編號</div><div>品名</div><div>單位</div><div class="r">單價</div><div>數量</div><div class="r">金額</div><div></div></div>
    <div id="list"></div>
    <div class="sum">
      <div><span>小計（未稅）</span><span id="sSub">0</span></div>
      <div><span>營業稅 5%</span><span id="sTax">0</span></div>
      <div class="total"><span>合計（含稅）</span><span id="sTot">0</span></div>
    </div>
  </div>

  <div class="card">
    <h2>備註（選填，會印在報價單上）</h2>
    <textarea id="remark" rows="3" placeholder="例：交期、付款方式…"></textarea>
  </div>
</div>

<div class="bar" id="mainBar"><div class="in">
  <button class="btn" id="btnAdd" disabled>新增品項</button>
  <button class="btn pri" id="btnGen" disabled>產生報價單</button>
</div></div>

<div id="quoteView">
  <div id="sheetBox"><div id="sheet" class="sheet"></div></div>
  <div class="bar"><div class="in">
    <button class="btn" id="btnBack">返回修改</button>
    <button class="btn pri" id="btnPdf">下載 PDF</button>
    <button class="btn pri" id="btnShare">分享</button>
  </div></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" async></script>
<script>
/* ========= 設定 ========= */
var SHEET_ID   = '19FiN1yVL8cIK-zIhUirbmlnw0fquNOpiIZSq3erkoGg';
var SHEET_GID  = '';            // 留空 = 第一個分頁；要指定分頁可填 gid 數字
var TAX_RATE   = 0.05;
var CURRENCY   = 'NT$';
var VALID_DAYS = 30;            // 報價有效天數
var LOAD_TIMEOUT_MS = 15000;
var COMPANY = { name: '', tel: '', email: '', addr: '' };  // 報價單抬頭（可留空）

/* ========= 小工具 ========= */
var $ = function(id){ return document.getElementById(id); };
var products = [];   // 由試算表即時讀取，不內建任何資料
var items = [];      // {type,pno,pname,unit,price,qty}
var loaded = false;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(n){ return (Math.round(n * 100) / 100).toLocaleString('zh-TW', {maximumFractionDigits: 2}); }
function money(n){ return CURRENCY + num(n); }
function todayStr(){ var d = new Date(), p = function(x){ return String(x).padStart(2, '0'); }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
var toastTimer;
function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2400); }

/* ========= JSONP（gviz）讀取 ========= */
function showLoadError(msg){
  loaded = false;
  var e = $('err'); e.textContent = '⚠ 無法讀取產品資料：' + msg + '　請確認網路連線與試算表共用設定後，重新整理頁面。';
  e.classList.add('show');
  $('status').textContent = '資料載入失敗';
  $('status').className = 'status';
  ['btnAdd','btnGen','selType','selPno'].forEach(function(id){ $(id).disabled = true; });
  ['qty','qMinus','qPlus'].forEach(function(id){ $(id).disabled = true; });
}

function loadProducts(){
  var cbName = '__gviz_cb_' + Date.now();
  var script = document.createElement('script');
  var done = false, timer;

  function cleanup(){ done = true; clearTimeout(timer); try{ delete window[cbName]; }catch(e){ window[cbName] = undefined; } if(script.parentNode) script.parentNode.removeChild(script); }

  window[cbName] = function(resp){
    if(done) return;
    cleanup();
    try{
      if(!resp || resp.status !== 'ok' || !resp.table){
        var m = (resp && resp.errors && resp.errors[0] && (resp.errors[0].detailed_message || resp.errors[0].message)) || '試算表回應錯誤';
        return showLoadError(m);
      }
      var cols = resp.table.cols.map(function(c){ return String(c.label || c.id || '').trim().toLowerCase(); });
      var idx = {};
      ['type','pno','pname','unit','price'].forEach(function(k, i){ var p = cols.indexOf(k); idx[k] = p >= 0 ? p : i; });
      var out = [];
      resp.table.rows.forEach(function(r){
        var c = r.c || [];
        var g = function(k){ var x = c[idx[k]]; return x && x.v != null ? x.v : ''; };
        var type = String(g('type')).trim(), pno = String(g('pno')).trim();
        if(!type || !pno) return;
        if(type.toLowerCase() === 'type' && pno.toLowerCase() === 'pno') return; // 標題列被當成資料時略過
        var price = typeof g('price') === 'number' ? g('price') : parseFloat(String(g('price')).replace(/[^0-9.\-]/g, ''));
        if(isNaN(price)) price = 0;
        out.push({ type: type, pno: pno, pname: String(g('pname')).trim(), unit: String(g('unit')).trim(), price: price });
      });
      if(!out.length) return showLoadError('試算表沒有可用的資料列');
      products = out; loaded = true;
      initPicker();
    }catch(e){ showLoadError('資料格式無法解析（' + e.message + '）'); }
  };

  script.onerror = function(){ if(done) return; cleanup(); showLoadError('連線失敗或試算表未開放檢視'); };
  timer = setTimeout(function(){ if(done) return; cleanup(); showLoadError('讀取逾時，或試算表未設為「知道連結的任何人可檢視」'); }, LOAD_TIMEOUT_MS);

  var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?headers=1&tqx=responseHandler:' + cbName + (SHEET_GID !== '' ? '&gid=' + encodeURIComponent(SHEET_GID) : '');
  script.src = url;
  document.head.appendChild(script);
}

/* ========= 選擇器 ========= */
function initPicker(){
  var types = [];
  products.forEach(function(p){ if(types.indexOf(p.type) < 0) types.push(p.type); });
  $('selType').innerHTML = '<option value="">請選擇類別</option>' + types.map(function(t){ return '<option>' + esc(t) + '</option>'; }).join('');
  $('selType').disabled = false;
  ['qty','qMinus','qPlus'].forEach(function(id){ $(id).disabled = false; });
  $('btnAdd').disabled = false;
  $('btnGen').disabled = false;
  $('status').textContent = '已載入 ' + products.length + ' 項產品（即時讀取自試算表）';
  $('status').className = 'status ok';
  $('err').classList.remove('show');
}

function currentProduct(){
  var t = $('selType').value, n = $('selPno').value;
  if(!t || !n) return null;
  for(var i = 0; i < products.length; i++) if(products[i].type === t && products[i].pno === n) return products[i];
  return null;
}
function showProduct(){
  var p = currentProduct();
  $('fName').value = p ? p.pname : '';
  $('fUnit').value = p ? p.unit : '';
  $('fPrice').value = p ? money(p.price) : '';
  var ex = p && findItem(p);
  $('qty').value = ex ? ex.qty : '';
}
$('selType').addEventListener('change', function(){
  var t = this.value, sp = $('selPno');
  if(!t){ sp.innerHTML = '<option value="">請先選類別</option>'; sp.disabled = true; showProduct(); return; }
  sp.innerHTML = '<option value="">請選擇編號</option>' + products.filter(function(p){ return p.type === t; })
    .map(function(p){ return '<option>' + esc(p.pno) + '</option>'; }).join('');
  sp.disabled = false; showProduct();
});
$('selPno').addEventListener('change', showProduct);
$('qMinus').addEventListener('click', function(){ var v = parseFloat($('qty').value) || 0; $('qty').value = Math.max(0, v - 1); });
$('qPlus').addEventListener('click', function(){ var v = parseFloat($('qty').value) || 0; $('qty').value = v + 1; });

/* ========= 品項清單 ========= */
function findItem(p){ for(var i = 0; i < items.length; i++) if(items[i].type === p.type && items[i].pno === p.pno) return items[i]; return null; }

function totals(){
  var sub = 0;
  items.forEach(function(it){ sub += Math.round(it.price * it.qty * 100) / 100; });
  var tax = Math.round(sub * TAX_RATE);
  return { sub: sub, tax: tax, total: sub + tax };
}

function renderList(){
  var box = $('list');
  if(!items.length){ box.innerHTML = '<div class="empty">尚未新增品項</div>'; }
  else box.innerHTML = items.map(function(it, i){
    return '<div class="item">' +
      '<div class="c-no">' + esc(it.pno) + '</div>' +
      '<div class="c-name">' + esc(it.pname) + '</div>' +
      '<div class="c-unit" data-l="單位">' + esc(it.unit) + '</div>' +
      '<div class="c-price" data-l="單價">' + money(it.price) + '</div>' +
      '<div class="c-qty" data-l="數量（0 = 刪除）"><input type="number" inputmode="decimal" min="0" step="any" value="' + it.qty + '" data-i="' + i + '"></div>' +
      '<div class="c-amt" data-l="金額">' + money(it.price * it.qty) + '</div>' +
      '<div class="c-del"><button class="del" data-del="' + i + '">刪除</button></div>' +
      '</div>';
  }).join('');
  var t = totals();
  $('cnt').textContent = items.length;
  $('sSub').textContent = money(t.sub);
  $('sTax').textContent = money(t.tax);
  $('sTot').textContent = money(t.total);
}
$('list').addEventListener('change', function(e){
  var i = e.target.getAttribute && e.target.getAttribute('data-i');
  if(i == null) return;
  var v = parseFloat(e.target.value);
  if(isNaN(v) || v < 0){ e.target.value = items[i].qty; return toast('請輸入 0 以上的數量'); }
  if(v === 0){ items.splice(i, 1); toast('已刪除品項'); }
  else items[i].qty = v;
  renderList(); showProduct();
});
$('list').addEventListener('click', function(e){
  var i = e.target.getAttribute && e.target.getAttribute('data-del');
  if(i == null) return;
  items.splice(i, 1); renderList(); showProduct();
});

$('btnAdd').addEventListener('click', function(){
  if(!loaded) return;
  var p = currentProduct();
  if(!p) return toast('請先選擇類別與編號');
  var raw = $('qty').value.trim();
  if(raw === '') return toast('請輸入數量');
  var q = parseFloat(raw);
  if(isNaN(q) || q < 0) return toast('數量格式不正確');
  var ex = findItem(p);
  if(q === 0){
    if(ex){ items.splice(items.indexOf(ex), 1); toast('已刪除：' + p.pno); renderList(); $('qty').value = ''; }
    else toast('數量為 0，不會加入');
    return;
  }
  if(ex){ ex.qty = q; toast('已更新數量：' + p.pno); }
  else { items.push({ type: p.type, pno: p.pno, pname: p.pname, unit: p.unit, price: p.price, qty: q }); toast('已新增：' + p.pno); }
  renderList();
});

/* ========= 報價單 ========= */
var quoteMeta = null;
function safeName(s){ return String(s).replace(/[\\\/:*?"<>|\s]+/g, '').slice(0, 40) || '客戶'; }
function pdfFileName(){ return '報價單_' + safeName(quoteMeta.cust) + '_' + quoteMeta.date + '.pdf'; }

function sheetHTML(){
  var m = quoteMeta, t = totals();
  var co = [COMPANY.name, COMPANY.addr, [COMPANY.tel && ('電話：' + COMPANY.tel), COMPANY.email && ('Email：' + COMPANY.email)].filter(Boolean).join('　')].filter(Boolean).map(esc).join('<br>');
  var until = new Date(m.date + 'T00:00:00'); until.setDate(until.getDate() + VALID_DAYS);
  var untilStr = until.getFullYear() + '-' + String(until.getMonth() + 1).padStart(2, '0') + '-' + String(until.getDate()).padStart(2, '0');
  var rows = items.map(function(it, i){
    return '<tr><td class="c">' + (i + 1) + '</td><td>' + esc(it.pno) + '</td><td>' + esc(it.pname) + '</td><td class="c">' + esc(it.unit) + '</td>' +
      '<td class="r">' + num(it.price) + '</td><td class="r">' + num(it.qty) + '</td><td class="r">' + num(it.price * it.qty) + '</td></tr>';
  }).join('');
  return '<h1>報　價　單</h1>' + (co ? '<div class="co">' + co + '</div>' : '') +
    '<div class="meta"><div>客戶：<b>' + esc(m.cust) + '</b>' + (m.contact ? '<br>聯絡人：' + esc(m.contact) : '') + '</div>' +
    '<div style="text-align:right">報價單號：' + esc(m.no) + '<br>報價日期：' + esc(m.date) + '<br>有效期限：' + untilStr + '</div></div>' +
    '<table><thead><tr><th class="c" style="width:40px">#</th><th style="width:90px">編號</th><th>品名</th><th class="c" style="width:50px">單位</th><th class="r" style="width:90px">單價</th><th class="r" style="width:60px">數量</th><th class="r" style="width:100px">金額</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="tot"><div><span>小計（未稅）</span><span>' + money(t.sub) + '</span></div><div><span>營業稅 5%</span><span>' + money(t.tax) + '</span></div><div class="g"><span>合計（含稅）</span><span>' + money(t.total) + '</span></div></div>' +
    '<div class="note">' + esc('說明：單價為未稅價格；本報價單自報價日起 ' + VALID_DAYS + ' 日內有效。' + (m.remark ? '\n備註：' + m.remark : '')) + '</div>';
}

function fitSheet(){
  var sheet = $('sheet'), box = $('sheetBox');
  var s = Math.min(1, (window.innerWidth - 16) / 794);
  sheet.style.transform = 'scale(' + s + ')';
  box.style.width = (794 * s) + 'px';
  box.style.height = (sheet.offsetHeight * s) + 'px';
}
window.addEventListener('resize', function(){ if($('quoteView').classList.contains('show')) fitSheet(); });

$('btnGen').addEventListener('click', function(){
  if(!loaded) return;
  var cust = $('cust').value.trim();
  if(!cust){ $('cust').focus(); return toast('請輸入客戶名稱'); }
  if(!items.length) return toast('請先新增至少一個品項');
  var date = $('qdate').value || todayStr();
  var now = new Date();
  quoteMeta = { cust: cust, contact: $('contact').value.trim(), date: date, remark: $('remark').value.trim(),
    no: 'Q' + date.replace(/-/g, '') + '-' + String(now.getHours()).padStart(2, '0') + String(now.getMinutes()).padStart(2, '0') };
  $('sheet').innerHTML = sheetHTML();
  $('quoteView').classList.add('show');
  $('quoteView').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  fitSheet();
});
$('btnBack').addEventListener('click', function(){
  $('quoteView').classList.remove('show');
  document.body.style.overflow = '';
});

/* ========= PDF／分享 ========= */
function makePdfBlob(){
  if(!window.html2pdf) return Promise.reject(new Error('PDF 元件尚未載入，請檢查網路後重試'));
  var clone = $('sheet').cloneNode(true);
  clone.removeAttribute('id');
  clone.style.cssText = 'width:700px;padding:0;transform:none;background:#fff;';
  clone.className = 'sheet';
  var opt = {
    margin: [14, 10, 14, 10],
    image: { type: 'jpeg', quality: 0.95 },
    html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', windowWidth: 800 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'legacy'], avoid: ['tr', '.tot', '.note'] }
  };
  return window.html2pdf().set(opt).from(clone).outputPdf('blob');
}
function download(blob, name){
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 4000);
}
function busy(on){ ['btnPdf','btnShare','btnBack'].forEach(function(id){ $(id).disabled = on; }); }

$('btnPdf').addEventListener('click', function(){
  busy(true); toast('正在產生 PDF…');
  makePdfBlob().then(function(b){ download(b, pdfFileName()); toast('已下載 PDF'); })
    .catch(function(e){ toast('PDF 產生失敗：' + e.message); })
    .then(function(){ busy(false); });
});
$('btnShare').addEventListener('click', function(){
  busy(true); toast('正在準備分享…');
  var name = pdfFileName();
  makePdfBlob().then(function(b){
    var file = new File([b], name, { type: 'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      return navigator.share({ files: [file], title: name.replace(/\.pdf$/, ''), text: '報價單：' + quoteMeta.cust })
        .catch(function(e){ if(e && e.name === 'AbortError') return; throw e; });
    }
    download(b, name);
    toast('此裝置不支援檔案分享，已改為下載 PDF');
  }).catch(function(e){ toast('分享失敗：' + (e.message || e)); })
    .then(function(){ busy(false); });
});

/* ========= 啟動 ========= */
$('qdate').value = todayStr();
renderList();
loadProducts();
</script>
